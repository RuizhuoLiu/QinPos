[project]
name = "qinpos"
version = "0.1.0"
description = "Guqin string and hui position assignment from jianpu melodies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "marimo>=0.23.14",
    "edit>=0.0.4",
    "streamlit>=1.61.1",
    "cairosvg>=2.9.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.optional-dependencies]
learn = ["torch>=2.2"]
dev = ["marimo", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qinpos"]
